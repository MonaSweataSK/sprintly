services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sprintly
      POSTGRES_USER: sprintly
      POSTGRES_PASSWORD: sprintly
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sprintly -d sprintly"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
